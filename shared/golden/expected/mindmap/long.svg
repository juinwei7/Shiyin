<text x="993.5" y="457" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">30:05</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1028" y="457">沒有標題的議題</tspan></text>
<rect x="421.5" y="32" width="29" height="34" rx="8" fill="#FFFFFF" stroke="#2F8A7E" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="440.5" y="49">—</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="383.5" y="49">沒有標題的段落</tspan></text>
