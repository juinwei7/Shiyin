<text font-size="20" fill="#FFFFFF" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="661" y="235">2027 年度產品規劃與跨部門資</tspan><tspan x="661" y="264">源協調會議（含 Q1 上線時程、</tspan><tspan x="661" y="293">預算與人力、風險檢討）</tspan></text>
<rect x="871" y="84" width="114.5" height="34" rx="8" fill="#FFFFFF" stroke="#C0563F" stroke-width="1.5"/>
<text x="881" y="101" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">00:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="915.5" y="101">上線時程</tspan></text>
<text x="1023.5" y="66.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">01:10</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1058" y="66.5">Q1 上線，目標 3/31；如果 2 月的壓力測試</tspan><tspan x="1058" y="85.5">沒過，就改成先開放內部使用，外部延到 4</tspan><tspan x="1058" y="104">月。</tspan></text>
<text x="1023.5" y="135.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">03:05</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1058" y="135.5">iOS 跟 Android 同一天上</tspan></text>
<rect x="871" y="166" width="84.5" height="34" rx="8" fill="#FFFFFF" stroke="#3E6FA8" stroke-width="1.5"/>
<text x="881" y="183" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">05:20</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="915.5" y="183">預算</tspan></text>
<text x="993.5" y="183" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">05:40</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1028" y="183">雲端費用比去年多 18%，主要是 GPU 推論</tspan></text>
<rect x="871" y="244.5" width="84.5" height="34" rx="8" fill="#FFFFFF" stroke="#B7862A" stroke-width="1.5"/>
<text x="881" y="261.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">10:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="915.5" y="261.5">人力</tspan></text>
<text x="993.5" y="230.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">10:30</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1028" y="230.5">前端缺 2 人</tspan></text>
<text x="993.5" y="261.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">11:00</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1028" y="261.5">後端：缺 1 人，但可以從平台組借</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="993.5" y="292.5">設計：沒問題</tspan></text>
<rect x="871" y="323" width="231" height="99" rx="8" fill="#FFFFFF" stroke="#7A5BA6" stroke-width="1.5"/>
<text x="881" y="340" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">20:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="915.5" y="340">風險檢討：第三方支付</tspan><tspan x="915.5" y="361.5">API（FonPay、LINE</tspan><tspan x="915.5" y="383.5">Pay、Apple Pay）在尖峰</tspan><tspan x="915.5" y="405">時段的逾時問題</tspan></text>
<text x="1140" y="363" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">21:15</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1174.5" y="363">FonPay 的 sandbox 跟正式環境行為不一樣，</tspan><tspan x="1174.5" y="382">要另外排測試。</tspan></text>
<rect x="871" y="440" width="84.5" height="34" rx="8" fill="#FFFFFF" stroke="#2F8A7E" stroke-width="1.5"/>
<text x="881" y="457" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">30:00</text>
