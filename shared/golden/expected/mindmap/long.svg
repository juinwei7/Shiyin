<text font-size="20" fill="#FFFFFF" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan x="681" y="265">2027 年度產品規劃與跨部門資</tspan><tspan x="681" y="294">源協調會議（含 Q1 上線時程、</tspan><tspan x="681" y="323">預算與人力、風險檢討）</tspan></text>
<rect x="891" y="88" width="114.5" height="34" rx="8" fill="#FFFFFF" stroke="#C0563F" stroke-width="1.5"/>
<text x="901" y="105" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">00:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="935.5" y="105">上線時程</tspan></text>
<text x="1043.5" y="70.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">01:10</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1078" y="70.5">Q1 上線，目標 3/31；如果 2 月的壓力測試</tspan><tspan x="1078" y="89.5">沒過，就改成先開放內部使用，外部延到 4</tspan><tspan x="1078" y="108">月。</tspan></text>
<text x="1043.5" y="139.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">03:05</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1078" y="139.5">iOS 跟 Android 同一天上</tspan></text>
<rect x="891" y="170" width="84.5" height="34" rx="8" fill="#FFFFFF" stroke="#3E6FA8" stroke-width="1.5"/>
<text x="901" y="187" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">05:20</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="935.5" y="187">預算</tspan></text>
<text x="1013.5" y="187" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">05:40</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1048" y="187">雲端費用比去年多 18%，主要是 GPU 推論</tspan></text>
<rect x="891" y="248.5" width="84.5" height="34" rx="8" fill="#FFFFFF" stroke="#B7862A" stroke-width="1.5"/>
<text x="901" y="265.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">10:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="935.5" y="265.5">人力</tspan></text>
<text x="1013.5" y="234.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">10:30</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1048" y="234.5">前端缺 2 人</tspan></text>
<text x="1013.5" y="265.5" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">11:00</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1048" y="265.5">後端：缺 1 人，但可以從平台組借</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1013.5" y="296.5">設計：沒問題</tspan></text>
<rect x="891" y="327" width="231" height="99" rx="8" fill="#FFFFFF" stroke="#7A5BA6" stroke-width="1.5"/>
<text x="901" y="344" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">20:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="935.5" y="344">風險檢討：第三方支付</tspan><tspan x="935.5" y="365.5">API（FonPay、LINE</tspan><tspan x="935.5" y="387.5">Pay、Apple Pay）在尖峰</tspan><tspan x="935.5" y="409">時段的逾時問題</tspan></text>
<text x="1160" y="367" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">21:15</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1194.5" y="367">FonPay 的 sandbox 跟正式環境行為不一樣，</tspan><tspan x="1194.5" y="386">要另外排測試。</tspan></text>
<rect x="891" y="444" width="84.5" height="34" rx="8" fill="#FFFFFF" stroke="#2F8A7E" stroke-width="1.5"/>
<text x="901" y="461" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">30:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="935.5" y="461">議題</tspan></text>
<text x="1013.5" y="461" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">30:05</text>
<text font-size="13" fill="#1E2625" text-anchor="start" dominant-baseline="central"><tspan x="1048" y="461">沒有標題的議題</tspan></text>
<rect x="891" y="496" width="84.5" height="34" rx="8" fill="#FFFFFF" stroke="#B5517A" stroke-width="1.5"/>
<text x="901" y="513" font-size="11" fill="#68726F" text-anchor="start" dominant-baseline="central">45:00</text>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan x="935.5" y="513">其他</tspan></text>
<rect x="441.5" y="32" width="29" height="34" rx="8" fill="#FFFFFF" stroke="#B5517A" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="460.5" y="49">—</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="403.5" y="49">沒有標題的段落</tspan></text>
<rect x="390.5" y="84" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#2F8A7E" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="460.5" y="101">下次會議</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="352.5" y="101">11/20（五）下午兩點</tspan></text>
<rect x="390.5" y="136" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#7A5BA6" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="460.5" y="153">未決問題</tspan></text>
<text x="352.5" y="153" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">40:10</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="318" y="153">人力不夠的時候，要先砍功能還是延後上線？</tspan></text>
<rect x="420.5" y="243" width="50" height="34" rx="8" fill="#FFFFFF" stroke="#B7862A" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="460.5" y="260">待辦</tspan></text>
<text x="382.5" y="200.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">15:02</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="348" y="200.5">王小明：整理 Q1 上線清單，含每一項的負責</tspan><tspan x="348" y="219.5">人、風險和備案，週五前寄給所有人</tspan><tspan x="348" y="238">（2026-11-13）</tspan></text>
<text x="382.5" y="269.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">1:02:05</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="338" y="269.5">確認 AWS 帳單</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="382.5" y="300.5">Alice：Review the deployment runbook</tspan><tspan x="382.5" y="319.5">（next Monday）</tspan></text>
<rect x="420.5" y="380" width="50" height="34" rx="8" fill="#FFFFFF" stroke="#3E6FA8" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="460.5" y="397">決議</tspan></text>
<text x="382.5" y="362.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">12:30</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="348" y="362.5">Q1 只上 internationalization-and-</tspan><tspan x="348" y="381.5">localization-pipeline 的第一階段，其他</tspan><tspan x="348" y="400">延到 Q2。</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="382.5" y="431.5">預算上限 NT$2,400,000</tspan></text>
<rect x="360.5" y="492" width="110" height="34" rx="8" fill="#FFFFFF" stroke="#C0563F" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="460.5" y="509">每個人的重點</tspan></text>
<text x="322.5" y="474.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">03:10</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="288" y="474.5">Alice：Proposed moving the launch to</tspan><tspan x="288" y="493.5">the first week of next quarter so QA</tspan><tspan x="288" y="512">has two more sprints</tspan></text>
<text x="322.5" y="543.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">12:40</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="288" y="543.5">Bob：Will draft the migration plan</tspan></text>
