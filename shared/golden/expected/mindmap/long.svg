<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="332.5" y="101">11/20（五）下午兩點</tspan></text>
<rect x="370.5" y="136" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#B7862A" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="440.5" y="153">未決問題</tspan></text>
<text x="332.5" y="153" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">40:10</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="298" y="153">人力不夠的時候，要先砍功能還是延後上線？</tspan></text>
<rect x="400.5" y="243" width="50" height="34" rx="8" fill="#FFFFFF" stroke="#3E6FA8" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="440.5" y="260">待辦</tspan></text>
<text x="362.5" y="200.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">15:02</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="328" y="200.5">王小明：整理 Q1 上線清單，含每一項的負責</tspan><tspan x="328" y="219.5">人、風險和備案，週五前寄給所有人</tspan><tspan x="328" y="238">（2026-11-13）</tspan></text>
<text x="362.5" y="269.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">1:02:05</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="318" y="269.5">確認 AWS 帳單</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="362.5" y="300.5">Alice：Review the deployment runbook</tspan><tspan x="362.5" y="319.5">（next Monday）</tspan></text>
<rect x="400.5" y="380" width="50" height="34" rx="8" fill="#FFFFFF" stroke="#C0563F" stroke-width="1.5"/>
<text font-size="15" fill="#1E2625" font-family="&quot;Songti TC&quot;, PMingLiU, &quot;Microsoft JhengHei&quot;, serif" font-weight="600" text-anchor="end" dominant-baseline="central"><tspan x="440.5" y="397">決議</tspan></text>
<text x="362.5" y="362.5" font-size="11" fill="#68726F" text-anchor="end" dominant-baseline="central">12:30</text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="328" y="362.5">Q1 只上 internationalization-and-</tspan><tspan x="328" y="381.5">localization-pipeline 的第一階段，其他</tspan><tspan x="328" y="400">延到 Q2。</tspan></text>
<text font-size="13" fill="#1E2625" text-anchor="end" dominant-baseline="central"><tspan x="362.5" y="431.5">預算上限 NT$2,400,000</tspan></text>
