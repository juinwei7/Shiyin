# Windows 版的測試（design-windows §15.1）：推到 windows 分支、或 PR 改到 windows/、shared/ 時，
# 在 x64、ARM64 的 Windows 和 macOS 跑 dotnet test（標準答案的比對、資料庫、整理工具）
name: Windows 版測試

on:
  push:
    branches: [windows]
    paths: ['windows/**', 'shared/**', 'scripts/windows/**', 'Resources/languages.json', 'Resources/opencc/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'shared/**', 'scripts/windows/**', 'Resources/languages.json', 'Resources/opencc/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - name: 測試
        run: dotnet test --project tests/Shiyin.Tests
      - name: 介面文字都有英文
        if: runner.os == 'macOS'
        working-directory: .
        run: python3 scripts/dev/l10n.py windows-check
      - name: 第三方授權跟套件版本一致
        if: runner.os == 'macOS'
        working-directory: .
        run: python3 scripts/windows/make-third-party-licenses.py --check
      # 真的 Windows 上把 app 建一次（Mac 上只做編譯檢查，XAML 的資源、自帶 Windows App SDK 要在 Windows 才會跑到）
      - name: 建置 app
        if: runner.os == 'Windows'
        run: dotnet build src/Shiyin.App/Shiyin.App.csproj -c Release -r win-${{ matrix.os == 'windows-11-arm' && 'arm64' || 'x64' }}
